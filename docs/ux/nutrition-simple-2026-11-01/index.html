<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthMate · Thu gọn giao diện dinh dưỡng</title>
<style>
  body{margin:0;background:#f3f6f5;color:#182c25;font:16px/1.6 "Segoe UI",sans-serif}
  main{max-width:1000px;margin:auto;padding:28px 20px 60px}
  h1{font-size:28px;line-height:1.3} h2{margin-top:44px;font-size:22px}
  p{max-width:760px;color:#475a53}
  .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  figure{margin:0;text-align:center}figcaption{font-weight:600;margin-bottom:12px}
  img{display:block;width:100%;max-width:390px;height:auto;margin:auto;border:1px solid #dce6e1;border-radius:18px}
  .single{max-width:390px;margin-top:20px}
  @media(max-width:560px){.pair{gap:10px}main{padding:18px 12px}h1{font-size:24px}}
</style>
<main>
  <h1>HealthMate · Giao diện theo dõi dinh dưỡng</h1>
  <p>Ưu tiên kcal, bữa ăn và thao tác thêm món. Ảnh widget với dữ liệu kiểm thử cố định ở 390×844, không phải nghiệm thu trên điện thoại.</p>
  <h2>Hôm nay</h2>
  <div class="pair">
    <figure><figcaption>Trước</figcaption><img src="before/home.png" alt="Hôm nay trước khi thu gọn"></figure>
    <figure><figcaption>Sau</figcaption><img src="after/home.png" alt="Hôm nay sau khi thu gọn"></figure>
  </div>
  <h2>Nhật ký</h2>
  <div class="pair">
    <figure><figcaption>Trước</figcaption><img src="before/diary.png" alt="Nhật ký trước khi thu gọn"></figure>
    <figure><figcaption>Sau</figcaption><img src="after/diary.png" alt="Nhật ký sau khi thu gọn"></figure>
  </div>
  <h2>Thêm món</h2>
  <p>Nút + mở thẳng form. Tìm kiếm ở đầu màn hình, lưu ở cuối. Công cụ phụ nằm trong dấu ⋯.</p>
  <figure class="single"><img src="after/meal-start.png" alt="Màn hình thêm món sau khi thu gọn"></figure>
</main>
</html>
